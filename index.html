<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e50914"><link rel="manifest" href="manifest.json"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet"><title>Base Quin</title><style>
:root{
  --red:#ed111c;--red2:#ff4d4d;--red-dark:#a60811;--black:#090909;--dark:#151515;--gray:#e9e9e9;--white:#fff;--muted:#6f7378;
  --surface:#fff;--surface-soft:#f7f7f7;--line:#dedede;
  --gold1:#f6d365;--gold2:#fda085;
  --blue1:#36d1dc;--blue2:#5b86e5;
  --purple1:#a445b2;--purple2:#d41872;
  --green1:#11998e;--green2:#38ef7d;
  --orange1:#f7971e;--orange2:#ffd200;
  --btc1:#f7931a;--btc2:#ffd58a;
  --dollar1:#0e8f4e;--dollar2:#34d399;
  --ibov1:#1b3a6b;--ibov2:#5b8fe0;
  --ir1:#8a5a1f;--ir2:#e0a94a;
}
*{box-sizing:border-box}
html{background:#000}
body{margin:0;min-height:100vh;background:#000;font-family:Arial,Helvetica,sans-serif;color:#111;overscroll-behavior-x:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select{font:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input:disabled,select:disabled,button:disabled{background:#d6d6d6!important;color:#666!important;opacity:1;cursor:not-allowed}
.app{max-width:480px;min-height:100vh;min-height:100svh;margin:auto;background:#f5f5f5;position:relative;overflow-x:hidden}

/* ---------- CAPA / TELA INICIAL ---------- */
.splash{
  min-height:100vh;min-height:100svh;
  background:#000;
  position:relative;overflow:hidden
}
.splash::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 53%,rgba(0,0,0,.38) 0%,rgba(0,0,0,.12) 24%,transparent 52%),linear-gradient(180deg,rgba(0,0,0,.08) 0%,transparent 42%,rgba(0,0,0,.28) 100%)}
.cover-caption{position:absolute;left:50%;top:62.5%;transform:translate(-50%,-50%);z-index:3;width:92%;color:#fff;text-align:center;font-style:italic;font-weight:800;font-size:clamp(14px,4vw,21px);letter-spacing:.5px;text-shadow:0 2px 4px rgba(0,0,0,.9)}
.cover-img{display:block;width:100%;height:100vh;height:100svh;object-fit:cover;object-position:center center;transform:translateY(-10%)}
.btn-enter-cover{position:absolute;left:50%;top:70.5%;transform:translate(-50%,-50%);z-index:3;width:64%;max-width:230px;min-height:64px;background:#000;color:var(--red);border:2.5px solid #888;padding:16px 14px;border-radius:11px;font-weight:900;font-size:18px;letter-spacing:1.5px;box-shadow:0 8px 18px rgba(0,0,0,.55);cursor:pointer}
.btn-enter-cover:hover{background:#111;border-color:#888;box-shadow:0 0 0 1px rgba(136,136,136,.4),0 8px 22px rgba(0,0,0,.35)}
.btn-enter-cover:active{transform:translate(-50%,-50%) scale(.97)}
.splash-beam{position:absolute;top:-15%;right:-18%;width:120px;height:150%;background:linear-gradient(180deg,rgba(237,17,28,0) 0%,rgba(237,17,28,.5) 45%,rgba(255,107,107,.65) 55%,rgba(237,17,28,0) 100%);transform:rotate(24deg);filter:blur(6px);opacity:.7;pointer-events:none}
.splash-chart{position:absolute;left:-4%;bottom:2%;width:66%;height:200px;opacity:.85;pointer-events:none}
.splash-glow{position:absolute;top:-12%;left:50%;transform:translateX(-50%);width:360px;height:360px;background:radial-gradient(circle,rgba(237,17,28,.22) 0%,rgba(237,17,28,0) 70%);pointer-events:none}
.splash-globe{position:absolute;left:50%;bottom:-58%;transform:translateX(-50%);width:720px;height:720px;border-radius:50%;pointer-events:none;z-index:1;
  background:
    radial-gradient(circle at 50% 0%,rgba(255,120,120,.95) 0%,rgba(237,17,28,.55) 1.2%,rgba(237,17,28,0) 3%),
    radial-gradient(circle,rgba(255,90,90,.55) 1px,transparent 1.6px) 0 0/16px 16px,
    radial-gradient(circle at 50% 25%,#220708 0%,#0a0303 55%,#000 100%);
  box-shadow:0 -2px 40px rgba(237,17,28,.5);
  mask-image:radial-gradient(circle at 50% 0%,#000 0%,#000 46%,transparent 47%);
  -webkit-mask-image:radial-gradient(circle at 50% 0%,#000 0%,#000 46%,transparent 47%);
}
.logo-frame{position:relative;z-index:2;width:100%;max-width:380px;margin:0 auto}
.logo-frame .logo-img{width:100%;display:block}
.logo-overlay{position:absolute;left:11%;right:11%;top:65%;bottom:4%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:7px}
.logo{font-family:'Anton',Impact,'Arial Black',sans-serif;line-height:.86;text-align:center;text-transform:uppercase}
.logo .word-base,.logo .word-quin{display:flex;justify-content:center}
.logo .ltr{display:inline-block;position:relative}
.logo .word-base{font-size:70px;letter-spacing:2px}
.logo .word-base .ltr{background:linear-gradient(180deg,#ffffff 0%,#f2f2f2 30%,#bdbdbd 55%,#7d7d7d 85%,#5c5c5c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.logo .word-quin{font-size:94px;letter-spacing:-1px;margin-top:-10px;background:linear-gradient(180deg,#ff8a8a 0%,#ff3b3b 22%,#ed111c 55%,#8c0a10 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(237,17,28,.6)) drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.a-arrow{position:absolute;left:50%;top:46%;width:.46em;height:.4em;transform:translate(-50%,-50%);background:linear-gradient(180deg,#ff8a8a,#ed111c);clip-path:polygon(50% 0%,100% 100%,0% 100%);filter:drop-shadow(0 0 6px rgba(237,17,28,.8))}
.logo-img{display:block;margin:0 auto;width:92%;max-width:380px;height:auto;filter:drop-shadow(0 6px 22px rgba(237,17,28,.35)) drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.tagline{position:relative;z-index:2;max-width:240px;text-align:center;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:600;font-size:14px;line-height:1.35;letter-spacing:.2px;margin:0;background:none;-webkit-background-clip:initial;background-clip:initial;color:#fff;-webkit-text-fill-color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.btn-enter{position:relative;z-index:2;width:52%;max-width:150px;background:#000;color:var(--red);border:2.5px solid #ffffff;padding:9px 10px;border-radius:10px;font-weight:900;font-size:12px;letter-spacing:1.5px;box-shadow:0 8px 18px rgba(0,0,0,.55);cursor:pointer}
.btn-enter:active{transform:scale(.97)}
.watermark{position:relative;z-index:2;margin:0;text-align:center;color:#d5d5d5;font-size:9.5px;font-style:italic;letter-spacing:.5px;opacity:.85}
.header-logo{display:block;object-fit:contain;object-position:center;flex-shrink:0;filter:drop-shadow(0 2px 6px rgba(237,17,28,.28))}
.header-logomark{display:block;flex-shrink:0}
.header-word{font-family:'Anton',Impact,'Arial Black',sans-serif;text-transform:uppercase;line-height:1;display:flex;align-items:baseline;gap:0}

/* ---------- HEADER / APP SHELL ---------- */
.header{position:sticky;top:0;z-index:4;background:linear-gradient(180deg,#0b0b0b 0%,#151515 100%);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;justify-content:center;gap:10px;min-height:calc(68px + env(safe-area-inset-top));border-bottom:2px solid var(--red-dark);box-shadow:0 3px 12px rgba(0,0,0,.2)}
.header .header-logo{position:absolute;left:50%;transform:translateX(-50%)}
.blank-screen{position:relative;isolation:isolate;min-height:calc(100vh - 66px);min-height:calc(100svh - 66px);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.screen-background-button{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:0;width:90%;height:76%;margin:0;padding:0;border:3px solid #ed111c;border-radius:24px;background:transparent;pointer-events:none;cursor:default}
.blank-screen-controls{position:relative;z-index:1}
.blank-screen-title{position:absolute;top:18px;left:12px;right:12px;z-index:1;margin:0;text-align:center;color:#19a7ff;font-size:22px;font-weight:900;letter-spacing:1.5px;text-shadow:0 0 5px #19a7ff,0 0 13px rgba(25,167,255,.85)}
.blank-screen.hidden{display:none}
.blank-screen-controls{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;padding:16px}
.screen-mode-control{position:relative;display:flex;flex-direction:column;align-items:stretch;width:190px;margin:0;z-index:2}
.screen-mode-button{width:100%;min-height:48px;padding:11px 14px;border:2px solid #123b78;border-radius:10px;background:#a9ddff;color:#092d61;font-size:15px;font-weight:900;text-transform:lowercase;cursor:pointer;box-shadow:0 3px 8px rgba(0,48,110,.18)}
.screen-mode-button:active{transform:scale(.98)}
.screen-mode-list{position:absolute;top:54px;left:0;width:100%;padding:5px;background:#fff;border:1.5px solid #123b78;border-radius:10px;box-shadow:0 8px 18px rgba(0,0,0,.18)}
.screen-mode-list.hidden{display:none}
.screen-mode-option{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:42px;padding:9px 10px;border:0;border-radius:7px;background:#fff;color:#15345e;text-align:left;font-size:14px;font-weight:700;cursor:pointer}
.screen-mode-option:hover,.screen-mode-option.selected{background:#d9efff}
.screen-mode-option .mode-check{visibility:hidden;color:#0b4d9b;font-weight:900}
.screen-mode-option.selected .mode-check{visibility:visible}
#app.theme-dark{--surface:#202124;--surface-soft:#292b2f;--line:#44474b;background:#111;color:#f2f2f2}
#app.theme-dark .content{background:#111;color:#f2f2f2}
#app.theme-dark .card,#app.theme-dark .indicator-card,#app.theme-dark .compare-choice,#app.theme-dark .investment-terms-box,#app.theme-dark .consider-box,#app.theme-dark .compare-item,#app.theme-dark .custom-date-calendar{background:#202124;color:#f2f2f2;border-color:#44474b}
#app.theme-dark .card p,#app.theme-dark .menu-card span,#app.theme-dark .compare-choice p,#app.theme-dark .note,#app.theme-dark .compare-row,#app.theme-dark .compare-tag,#app.theme-dark .treasury-line{color:#c2c5ca}
#app.theme-dark .field input,#app.theme-dark .field select,#app.theme-dark .simple-display,#app.theme-dark .simple-date-picker select,#app.theme-dark .direct-date-entry select,#app.theme-dark .direct-date-entry input,#app.theme-dark .date-display{background:#17181a;color:#f2f2f2;border-color:#555}
#app.theme-dark .field label,#app.theme-dark .compare-item strong,#app.theme-dark .compare-item b,#app.theme-dark .compare-row b,#app.theme-dark .indicator-card strong,#app.theme-dark .ir-row b{color:#f2f2f2}
#app.theme-dark .switch button,#app.theme-dark .total-period-control button,#app.theme-dark .offered-rate-controls button,#app.theme-dark .simple-keypad button{background:#34363a;color:#f2f2f2;border-color:#555}
#app.theme-dark .switch button.active,#app.theme-dark .total-period-control button.active,#app.theme-dark .offered-rate-controls button.active{background:var(--red);border-color:var(--red);color:#fff}
#app.theme-dark .compare-reference,#app.theme-dark .ir-reference-box{background:#2b2d31;border-color:#4c4f54}
#app.theme-dark .compare-tax,#app.theme-dark .compare-tax b{background:#292b2f;color:#eee;border-color:#4c4f54}
#app.theme-dark .custom-date-grid button{background:#25272a;color:#eee;border-color:#414347}
#app.theme-dark .blank-screen{background:#111}
#app.theme-dark .screen-mode-list{background:#202124;border-color:#78baff}
#app.theme-dark .screen-mode-option{background:#202124;color:#eaf5ff}
#app.theme-dark .screen-mode-option:hover,#app.theme-dark .screen-mode-option.selected{background:#303b49}
.important-button{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:2;display:block;min-height:23px;margin:0;padding:4px 7px;border:1px solid #27364a;border-radius:5px;background:#e9f1fa;color:#172b45;font-size:8px;line-height:1.1;font-weight:700;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.important-blank-stage{display:none;min-height:calc(100vh - 66px);min-height:calc(100svh - 66px);background:#fff}
.important-blank-stage img{display:block;width:min(92%,619px);height:auto;max-height:calc(100vh - 82px);max-height:calc(100svh - 82px);margin:auto;object-fit:contain}
.important-blank-stage.active{display:flex;align-items:center;justify-content:center}
#app.theme-dark .important-blank-stage{background:#111}
#app.theme-dark .important-button{background:#30363d;color:#eaf2fb;border-color:#66717e}
.header-word .base{font-family:'Anton',Impact,'Arial Black',sans-serif;text-transform:uppercase;background:linear-gradient(180deg,#ffffff 0%,#bdbdbd 60%,#7d7d7d 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.header-word .quin{font-family:'Anton',Impact,'Arial Black',sans-serif;text-transform:uppercase;margin-left:0;background:linear-gradient(180deg,#ff8a8a 0%,#ed111c 60%,#8c0a10 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 12px rgba(237,17,28,.35)}
.content{padding:15px 14px calc(95px + env(safe-area-inset-bottom))}
.cover-byline{position:absolute;left:50%;top:85.5%;transform:translate(-50%,-50%);z-index:3;width:92%;text-align:center;color:#888;font-size:13px;font-weight:600}
.tabs{display:flex;background:#e3e3e3;border:1px solid #cfcfcf;border-radius:12px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 7px rgba(0,0,0,.08)}
.tabs button{flex:1;border:0;min-height:48px;padding:13px 6px;font-weight:800;font-size:14px;background:transparent;color:#3a3a3a;cursor:pointer;transition:background .12s ease,color .12s ease}
.tabs button.active{background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.tabs button+button{border-left:1px solid rgba(0,0,0,.18)}
.tabs button.active{background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.screen{display:none}
.screen.active{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.card h2{margin:0 0 4px;font-family:'Anton',Impact,'Arial Black',sans-serif;font-weight:400;letter-spacing:.35px;font-size:21px}
#home>.card>h2,#indicators>.card h2{text-align:center;color:#19a7ff;text-shadow:0 0 8px rgba(25,167,255,.65)}
#home>.card>h2{margin-bottom:26px}
#indicators>.card>div:first-child{justify-content:center!important}
#indicators>.card>p{text-align:center}
#calc>.card:first-child{margin-bottom:46px}
.financial-tools-title{margin:5px 0 18px;text-align:center;font-size:19px;font-weight:900;letter-spacing:.25px;background:linear-gradient(90deg,#005cff 0%,#39b8ff 50%,#005cff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 9px rgba(0,132,255,.45)}
.card p{margin:0 0 15px;color:#666;font-size:13px;line-height:1.4}
.menu-card{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;border:2px solid #ddd;transition:transform .12s ease,border-color .12s ease,background .12s ease;user-select:none}
.ico.c-graphite{background:linear-gradient(135deg,#d8d8d8,#b9b9b9);color:#222}
.ico.c-black{background:#000;color:#fff;border:1px solid #333}
.ico{width:46px;height:46px;border-radius:12px;color:#fff;display:grid;place-items:center;font-size:23px;flex-shrink:0;box-shadow:0 4px 10px #00000022}.compare-photo-icon{width:44px;height:44px;display:block;object-fit:contain;border-radius:9px}
.ico.c-gold{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#3a2400}
.ico.c-blue{background:linear-gradient(135deg,var(--blue1),var(--blue2))}
.ico.c-purple{background:linear-gradient(135deg,var(--purple1),var(--purple2))}
.ico.c-green{background:linear-gradient(135deg,var(--green1),var(--green2));color:#04321f}
.ico.c-orange{background:linear-gradient(135deg,var(--orange1),var(--orange2));color:#3a2400}
.ico.c-red{background:linear-gradient(135deg,var(--red),var(--red2))}
.ico.c-dollar{background:linear-gradient(135deg,var(--dollar1),var(--dollar2))}
.ico.c-btc{background:linear-gradient(135deg,var(--btc1),var(--btc2));color:#3a2400}
.ico.c-ibov{background:linear-gradient(135deg,var(--ibov1),var(--ibov2))}
.ico.c-ir{background:linear-gradient(135deg,var(--ir1),var(--ir2));color:#2a1500}
.menu-card strong{font-size:15px;letter-spacing:.1px}
.menu-card span{display:block;color:#666;font-size:12px;line-height:1.35;margin-top:3px}
.arrow{margin-left:auto;font-size:24px;color:#999}
.field{margin:12px 0}
.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}
.field input,.field select{width:100%;min-height:48px;padding:13px;border:1px solid #c9cdd1;border-radius:9px;font-size:16px;background:#fff;outline:none}
.field input:focus,.field select:focus{border-color:var(--red);box-shadow:0 0 0 2px #ed111c20}
#app input.value-entered,#app select.value-entered,#app textarea.value-entered{color:#1261d6!important}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rule-equation-row{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;gap:6px}
.rule-equation-row .field{min-width:0}
.rule-arrow{color:#1261d6;font-size:28px;font-weight:300;text-align:center;line-height:1}
.investment-date-row{grid-template-columns:1fr;align-items:stretch;gap:8px}
.investment-date-row .field{display:flex;flex-direction:column}
.investment-date-row .field>label{min-height:32px;display:flex;align-items:flex-end}
.simple-date-picker{display:grid;grid-template-columns:.8fr .8fr 1.2fr;gap:4px;margin-top:auto}
.simple-date-picker select{min-height:48px;padding:8px 4px;font-size:13px;color:#666;font-weight:800;text-align:center;background:#fff;appearance:auto;-webkit-appearance:menulist}
.simple-date-picker select.date-selected{color:#1261d6}

.switch{display:flex;gap:5px}
.switch button{flex:1;min-height:46px;padding:11px;border:1px solid #ccc;border-radius:8px;background:#eee;font-weight:800;font-size:12.5px;cursor:pointer}
.switch button.active{background:var(--red);color:#fff;border-color:var(--red)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}
.clear-dates-action{width:auto;margin:8px auto 0}
.btn{border:0;border-radius:9px;min-height:48px;padding:14px;font-size:15px;font-weight:900;cursor:pointer;transition:filter .12s ease,transform .12s ease}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.985)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ff7b81;outline-offset:2px}
.primary{background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;box-shadow:0 4px 10px rgba(165,8,17,.22)}
.secondary{background:linear-gradient(135deg,#252525,#101010);color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.16)}
.btn.clear-dates-action{display:block;min-height:34px;margin:10px auto 22px;padding:7px 12px;border:1px solid #c9c9c9;border-radius:7px;background:#eeeeee;color:#555;box-shadow:none;font-size:12px;font-weight:700}
.result{background:linear-gradient(135deg,#151515,#292929);color:#fff;border-radius:12px;padding:15px;margin-top:13px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.result .big{font-size:25px;font-weight:900;color:#ff6b70;margin:3px 0 5px}
.result .line{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #454545;font-size:13px;color:#dedede}
.result .line b{color:#fff}
.result .line:last-child{border:0}
.note{font-size:11px;line-height:1.4;color:#6c7074;margin-top:10px}
.pink-note{color:#ff1493;font-weight:800;font-size:12px;text-shadow:0 0 4px rgba(255,20,147,.25)}
.compare-choice .pink-note{margin-top:28px}
.back{border:0;background:none;color:#19a7ff;font-size:38px;font-weight:900;line-height:.8;width:44px;height:44px;padding:0;text-shadow:0 0 8px rgba(25,167,255,.75);cursor:pointer}
.title{font-family:'Anton',Impact,'Arial Black',sans-serif;font-weight:400;font-size:20px;letter-spacing:.35px;color:#19a7ff;text-shadow:0 0 8px rgba(25,167,255,.65)}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;background:linear-gradient(180deg,#171717,#0b0b0b);color:#fff;display:flex;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:2px solid var(--red-dark);z-index:5}
.bottom button{flex:1;background:none;border:0;color:#aaa;font-size:11px;font-weight:800}
.bottom button.active{color:#ed111c}
.bottom b{display:block;font-size:20px}
.bottom .bottom-settings{flex:0 0 54px;color:#fff;font-size:9px}
.bottom .bottom-settings.active{color:#ed111c}
.bottom .bottom-settings.active svg{filter:drop-shadow(0 0 5px rgba(237,17,28,.7))}
.bottom .bottom-settings b{display:grid;place-items:center}
.bottom .bottom-settings svg{display:block;width:23px;height:23px}
.hidden{display:none!important}

/* campos preenchidos ficam azuis em todas as calculadoras */
function markFilledField(el){if(!el||!['INPUT','SELECT','TEXTAREA'].includes(el.tagName)||el.readOnly||el.disabled)return;el.classList.toggle('value-entered',String(el.value??'').trim()!=='')}
document.addEventListener('input',e=>markFilledField(e.target));
document.addEventListener('change',e=>markFilledField(e.target));

let screenModePreference='auto';
const screenModeMedia=window.matchMedia?.('(prefers-color-scheme: dark)');
function applyScreenMode(){
  const useDark=screenModePreference==='dark'||(screenModePreference==='auto'&&!!screenModeMedia?.matches);
  document.getElementById('app')?.classList.toggle('theme-dark',useDark);
  document.querySelectorAll('.screen-mode-option').forEach(option=>{
    const selected=option.dataset.mode===screenModePreference;
    option.classList.toggle('selected',selected);
    option.setAttribute('aria-selected',String(selected));
  });
}
function initScreenMode(){
  try{const saved=localStorage.getItem('basequin-screen-mode');if(['light','dark','auto'].includes(saved))screenModePreference=saved}catch(_e){}
  applyScreenMode();
  screenModeMedia?.addEventListener?.('change',()=>{if(screenModePreference==='auto')applyScreenMode()});
}
function toggleScreenModeList(){
  const list=document.getElementById('screenModeList'),button=document.getElementById('screenModeButton');
  const opening=list.classList.contains('hidden');
  list.classList.toggle('hidden',!opening);
  button.setAttribute('aria-expanded',String(opening));
}
function setScreenMode(mode){
  if(!['light','dark','auto'].includes(mode))return;
  screenModePreference=mode;
  try{localStorage.setItem('basequin-screen-mode',mode)}catch(_e){}
  applyScreenMode();
  document.getElementById('screenModeList').classList.add('hidden');
  document.getElementById('screenModeButton').setAttribute('aria-expanded','false');
}
function openImportantBlankScreen(){
  document.getElementById('blankScreenControls')?.classList.add('hidden');
  document.getElementById('blankScreenTitle')?.classList.add('hidden');
  document.querySelector('.screen-background-button')?.classList.add('hidden');
  const stage=document.getElementById('importantBlankStage');
  stage?.classList.add('active');
  stage?.setAttribute('aria-hidden','false');
}
function returnFromImportantBlankScreen(){
  const stage=document.getElementById('importantBlankStage');
  if(!stage?.classList.contains('active'))return false;
  stage.classList.remove('active');
  stage.setAttribute('aria-hidden','true');
  document.getElementById('blankScreenControls')?.classList.remove('hidden');
  document.getElementById('blankScreenTitle')?.classList.remove('hidden');
  document.querySelector('.screen-background-button')?.classList.remove('hidden');
  return true;
}
let previousBottomActive='bottomCalc';
function setBottomActive(id){
  document.querySelectorAll('#bottom button').forEach(button=>{
    const selected=button.id===id;
    button.classList.toggle('active',selected);
    if(selected)button.setAttribute('aria-current','page');
    else button.removeAttribute('aria-current');
  });
}

function footerBack(){
  const activeBottom=document.querySelector('#bottom button.active')?.id;
  if(activeBottom==='bottomSettings'){showIndicators();return}
  if(activeBottom==='bottomIndicators'){showHome();return}
  if(activeBottom==='bottomCalc'){goHomeSplash();return}
  goHomeSplash();
}
function closeBlankScreenForNavigation(){
  const blank=document.getElementById('blankScreen');
  if(!blank||blank.classList.contains('hidden'))return;
  returnFromImportantBlankScreen();
  blank.classList.add('hidden');
  blank.setAttribute('aria-hidden','true');
  document.getElementById('main').classList.remove('hidden');
  document.getElementById('bottomSettings').setAttribute('aria-pressed','false');
  document.getElementById('app')?.classList.remove('settings-open');
  setBottomActive(previousBottomActive);
}
function toggleBlankScreen(){
  if(returnFromImportantBlankScreen())return;
  const blank=document.getElementById('blankScreen');
  const main=document.getElementById('main');
  const button=document.getElementById('bottomSettings');
  const opening=blank.classList.contains('hidden');
  if(opening){
    previousBottomActive=document.querySelector('#bottom button.active:not(#bottomSettings)')?.id||'bottomCalc';
    setBottomActive('bottomSettings');
  }else{
    setBottomActive(previousBottomActive);
  }
  blank.classList.toggle('hidden',!opening);
  blank.setAttribute('aria-hidden',String(!opening));
  document.getElementById('app')?.classList.toggle('settings-open',opening);
  if(opening)requestAnimationFrame(restoreMovableSettingsButtons);
  main.classList.toggle('hidden',opening);
  button.setAttribute('aria-label',opening?'Fechar tela em branco':'Abrir tela em branco');
  button.setAttribute('aria-pressed',String(opening));
}
function enterApp(){
  document.getElementById('splash').classList.add('hidden');
  document.getElementById('header').classList.remove('hidden');
  document.getElementById('main').classList.remove('hidden');
  document.getElementById('bottom').classList.remove('hidden');
}
function enterAppCalc(){
  enterApp();
  showHome();
}
function goHomeSplash(){
  stopAutoRefresh();
  document.getElementById('header').classList.add('hidden');
  document.getElementById('main').classList.add('hidden');
  document.getElementById('bottom').classList.add('hidden');
  document.getElementById('bottomSettings')?.setAttribute('aria-pressed','false');
  setBottomActive('bottomHome');
  document.getElementById('splash').classList.remove('hidden');
}

function proximaReuniaoCopom(){
  const hoje=new Date();hoje.setHours(0,0,0,0);
  for(const d of COPOM_DATAS){
    const dt=new Date(d+'T00:00:00');

/* fetch com timeout + novas tentativas automáticas, para lidar com instabilidade de rede */
async function fetchJSON(url,opts={}){
  const retries=opts.retries??2,timeout=opts.timeout??8000;
  let lastErr;
  for(let attempt=0;attempt<=retries;attempt++){
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(),timeout);
    try{
      const r=await fetch(url,{signal:ctrl.signal,cache:'no-store'});
      clearTimeout(t);
      if(!r.ok)throw new Error('HTTP '+r.status);
      return await r.json();
    }catch(err){
      clearTimeout(t);
      lastErr=err;
      if(attempt<retries)await new Promise(res=>setTimeout(res,500*(attempt+1)));
    }
  }
  throw lastErr;
}
async function bcbSeries(series,qtd){
  const url=`https://api.bcb.gov.br/dados/serie/bcdata.sgs.${series}/dados/ultimos/${qtd}?formato=json`;
  return fetchJSON(url);
}

async function updateIndicatorsData(){
  // Selic (meta Copom)
  try{
    const [selic]=await bcbSeries(432,1);
    document.getElementById('selicVal').textContent=pct(parseNum(selic.valor));
    document.getElementById('selicDate').textContent='BCB • '+selic.data;
  }catch(e){
    document.getElementById('selicVal').textContent='Indisponível';
    document.getElementById('selicDate').textContent='Falha ao consultar BCB';
  }

  // Inflação (IPCA) mensal + acumulado 12 meses
  try{
    const mensalArr=await bcbSeries(433,1);
    const anualArr=await bcbSeries(433,12);
    const mensalVal=parseNum(mensalArr[0].valor);
    let fator=1;anualArr.forEach(o=>fator*=(1+parseNum(o.valor)/100));
    const anualVal=(fator-1)*100;
    IND.inflacao={mensal:pct(mensalVal),anual:pct(anualVal)};
    document.getElementById('inflacaoVal').textContent=IND.inflacao.mensal;
    document.getElementById('inflacaoDate').textContent='IBGE/BCB • '+mensalArr[0].data;
  }catch(e){
    IND.inflacao={mensal:'Indisponível',anual:'Indisponível'};
    document.getElementById('inflacaoVal').textContent='Indisponível';
    document.getElementById('inflacaoDate').textContent='Tente atualizar novamente';
  }

  // Poupança mensal + anual estimado
  try{
    const [poup]=await bcbSeries(195,1);
    const mensalVal=parseNum(poup.valor);
    const anualVal=(Math.pow(1+mensalVal/100,12)-1)*100;
    IND.poup={mensal:pct(mensalVal),anual:pct(anualVal)};
    document.getElementById('poupVal').textContent=IND.poup.mensal;
    document.getElementById('poupDate').textContent='BCB • '+poup.data;
  }catch(e){
    IND.poup={mensal:'Indisponível',anual:'Indisponível'};
    document.getElementById('poupVal').textContent='Indisponível';
    document.getElementById('poupDate').textContent='Tente atualizar novamente';
  }

  // CDI (taxa diária anualizada base 252)
  try{
    const [cdi]=await bcbSeries(12,1);
    const diaVal=parseNum(cdi.valor);
    const anualVal=(Math.pow(1+diaVal/100,252)-1)*100;
    document.getElementById('cdiVal').textContent=pct(anualVal);
    document.getElementById('cdiDate').textContent='BCB • '+cdi.data+' • '+pct(diaVal)+' a.d.';
    document.getElementById('copomDate').textContent='Próxima reunião do Copom: '+proximaReuniaoCopom();
  }catch(e){
    document.getElementById('cdiVal').textContent='Indisponível';
    document.getElementById('cdiDate').textContent='Falha ao consultar BCB';
    document.getElementById('copomDate').textContent='Próxima reunião do Copom: '+proximaReuniaoCopom();
  }

  // Dólar comercial — séries oficiais de compra e venda do Banco Central.
  // O SGS tem CORS habilitado, evitando a falha de consulta direta no navegador.
  try{
    const ptax=await fetchPTAXAtual();
    if(!ptax) throw new Error('sem boletim PTAX');
    const dt=new Date(ptax.dataHoraCotacao);
    const rotulo=ptax.tipoBoletim==='Fechamento'?'Fechamento PTAX':'PTAX • '+ptax.tipoBoletim;
    IND.dolarRaw={compra:Number(ptax.cotacaoCompra),venda:Number(ptax.cotacaoVenda)};
    IND.dolar={compra:BRLPTAX.format(IND.dolarRaw.compra),venda:BRLPTAX.format(IND.dolarRaw.venda)};
    const tipoAtivo=document.getElementById('dolarBtn2')?.classList.contains('active')?'venda':'compra';
    document.getElementById('dolarVal').textContent=IND.dolar[tipoAtivo];
    document.getElementById('dolarDate').textContent=`${rotulo} (BCB) • `+dt.toLocaleDateString('pt-BR')+' '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    document.getElementById('dolarVal').textContent='Indisponível';
    document.getElementById('dolarDate').textContent='Sem conexão com o BCB — toque em Atualizar';
  }

  // Ouro e Bitcoin: fontes com CORS habilitado para uso direto no navegador.
  const [ouroResult,btcResult]=await Promise.allSettled([
    fetchJSON('https://api.gold-api.com/price/XAU',{retries:1}),
    fetchJSON('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=brl&include_last_updated_at=true',{retries:1})
  ]);
  if(ouroResult.status==='fulfilled'&&Number.isFinite(Number(ouroResult.value?.price))&&Number.isFinite(IND.dolarRaw?.venda)){
    const dolarVenda=IND.dolarRaw.venda;
    const gramaVal=Number(ouroResult.value.price)*dolarVenda/31.1034768;
    document.getElementById('ouroVal').textContent=BRL4.format(gramaVal);
    document.getElementById('ouroDate').textContent='Mercado • '+(ouroResult.value.updatedAtReadable||ouroResult.value.updatedAt||'agora');
  }else{
    document.getElementById('ouroVal').textContent='Indisponível';
    document.getElementById('ouroDate').textContent='Sem conexão com a API — toque em Atualizar';
  }
  if(btcResult.status==='fulfilled'&&Number.isFinite(Number(btcResult.value?.bitcoin?.brl))){
    const atualizado=btcResult.value.bitcoin.last_updated_at;
    document.getElementById('btcVal').textContent=BRL.format(Number(btcResult.value.bitcoin.brl));
    document.getElementById('btcDate').textContent='Mercado • '+(atualizado?new Date(atualizado*1000).toLocaleString('pt-BR'):'agora');
  }else{
    document.getElementById('btcVal').textContent='Indisponível';
    document.getElementById('btcDate').textContent='Sem conexão com a API — toque em Atualizar';
  }

  // Índice Ibovespa: tenta uma fonte compatível com navegador e preserva
  // o último valor válido quando uma fonte estiver temporariamente indisponível.
  try{
    const meta=await fetchIbovMeta();
    if(!meta) throw new Error('sem dado Ibovespa');
    renderIbovMeta(meta,false);
  }catch(e){
    if(!restoreIbovCache()){
      document.getElementById('ibovVal').textContent='Indisponível';
      document.getElementById('ibovDate').textContent='Sem conexão com a API — tentando novamente em 60s';
    }
  }
}

const IBOV_CACHE_KEY='basequin.ibov.v2';

function renderIbovMeta(meta,fromCache){
  const valor=Number(meta.regularMarketPrice);
  if(!Number.isFinite(valor)) throw new Error('valor Ibovespa inválido');
  const anterior=Number(meta.previousClose||meta.chartPreviousClose);
  const variacao=Number.isFinite(Number(meta.regularMarketChangePercent))
    ? Number(meta.regularMarketChangePercent)
    : (Number.isFinite(anterior)&&anterior!==0 ? ((valor/anterior)-1)*100 : null);
  const sinal=variacao===null?'':` • ${variacao>=0?'+':''}${variacao.toFixed(2).replace('.',',')}% no dia`;
  const horario=Number(meta.regularMarketTime)
    ? new Date(Number(meta.regularMarketTime)*1000).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})
    : '';
  document.getElementById('ibovVal').textContent=valor.toLocaleString('pt-BR',{maximumFractionDigits:0})+' pts';
  document.getElementById('ibovDate').textContent=(fromCache?'Última leitura salva':'B3/Yahoo Finance')+sinal+(horario?' • '+horario:'');
  if(!fromCache){
    try{localStorage.setItem(IBOV_CACHE_KEY,JSON.stringify({...meta,savedAt:Date.now()}))}catch(e){}
  }
}

function restoreIbovCache(){
  try{
    const cache=JSON.parse(localStorage.getItem(IBOV_CACHE_KEY)||'null');
    if(cache&&Number.isFinite(Number(cache.regularMarketPrice))){renderIbovMeta(cache,true);return true}
  }catch(e){}
  return false;
}

function parseYahooPayload(body){
  if(body?.chart?.result?.[0]?.meta)return body;
  const text=typeof body==='string'?body:body?.contents;
  if(typeof text!=='string')return null;
  const start=text.indexOf('{"chart"');
  if(start<0)return null;
  try{return JSON.parse(text.slice(start).trim())}catch(e){
    try{return JSON.parse(text.slice(start,text.lastIndexOf('}')+1))}catch(e2){return null}
  }
}

async function fetchText(url,opts={}){
  const retries=opts.retries??0,timeout=opts.timeout??9000;
  let lastErr;
  for(let attempt=0;attempt<=retries;attempt++){
    const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),timeout);
    try{
      const r=await fetch(url,{signal:ctrl.signal,cache:'no-store'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      return await r.text();
    }catch(err){
      lastErr=err;
      if(attempt<retries)await new Promise(res=>setTimeout(res,500));
    }finally{clearTimeout(timer)}
  }
  throw lastErr;
}

// Yahoo não libera CORS direto no navegador. As fontes são consultadas
// em paralelo para que uma instabilidade não impeça a atualização automática.
async function fetchIbovMeta(){
  const agora=Date.now();
  const yahoo='https://query1.finance.yahoo.com/v8/finance/chart/%5EBVSP?interval=1m&range=1d&_='+agora;
  const yahoo2='https://query2.finance.yahoo.com/v8/finance/chart/%5EBVSP?interval=1m&range=1d&_='+agora;
  const yahooJina=yahoo.replace(/&/g,'%26');
  const fontes=[
    fetchText('https://r.jina.ai/'+yahooJina,{timeout:10000}).then(parseYahooPayload),
    fetchJSON('https://api.allorigins.win/raw?url='+encodeURIComponent(yahoo),{retries:0,timeout:10000}),
    fetchJSON('https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(yahoo2),{retries:0,timeout:10000}),
    fetchJSON('https://api.allorigins.win/get?url='+encodeURIComponent(yahoo2),{retries:0,timeout:10000})
      .then(parseYahooPayload)
  ];
  try{
    const resultados=await Promise.all(fontes.map(p=>p.catch(()=>null)));
    for(const j of resultados){
      const meta=parseYahooPayload(j)?.chart?.result?.[0]?.meta;
      if(meta&&typeof meta.regularMarketPrice==='number')return meta;
    }
  }catch(e){}
  return null;
}

// Busca o boletim PTAX mais recente do Banco Central, retrocedendo dia a dia
// (necessário em fins de semana, feriados ou antes da abertura do primeiro boletim).
async function fetchPTAXAtual(){
  // As séries SGS do BCB permitem consulta direta no navegador (CORS habilitado)
  // e representam as cotações oficiais de compra e venda do último dia útil.
  const [compraArr,vendaArr]=await Promise.all([bcbSeries(10813,1),bcbSeries(1,1)]);
  const compra=compraArr?.[0],venda=vendaArr?.[0];
  if(!compra||!venda) return null;
  const [dia,mes,ano]=String(venda.data).split('/');
  return {
    cotacaoCompra:parseNum(compra.valor),
    cotacaoVenda:parseNum(venda.valor),
    dataHoraCotacao:`${ano}-${mes}-${dia}T12:00:00-03:00`,
    tipoBoletim:'Cotação diária'
  };
}

function compareFuture(rateAnnual,initial,monthly,months){
  const monthlyRate=Math.pow(1+rateAnnual/100,1/12)-1;
  let balance=initial;
  for(let i=0;i<months;i++){balance*=1+monthlyRate;balance+=monthly}
  const invested=initial+monthly*months;
  return {gross:balance,invested,gain:Math.max(0,balance-invested)};
}

function readCompareDate(prefix){

function irRate(days){
  if(days<=180)return .225;
  if(days<=360)return .20;
  if(days<=720)return .175;
  return .15;
}

    imposto+=ganhoInicial*irRate(irDaysFromMonths(months));
    for(let i=1;i<=months;i++){
      const ganho=Math.max(0,a*(Math.pow(1+r,months-i)-1));
      imposto+=ganho*irRate(irDaysFromMonths(months-i));
    }
  }
  const liquido=fv-imposto,ganhoLiquido=liquido-inv,irLabel=taxable?pct(irRate(irDaysFromMonths(months))*100):'isento';
  document.getElementById('cres').innerHTML=`<b>Resultado líquido estimado</b><div class="big">${BRL.format(liquido)}</div><div class="line"><span>Valor bruto</span><b>${BRL.format(fv)}</b></div><div class="line"><span>Valor total investido</span><b>${BRL.format(inv)}</b></div><div class="line"><span>IR estimado (${irLabel})</span><b>${BRL.format(imposto)}</b></div><div class="line"><span>Rendimento líquido</span><b>${BRL.format(ganhoLiquido)}</b></div><div class="line"><span>Rentabilidade líquida</span><b>${pct(inv?ganhoLiquido/inv*100:0)}</b></div>`
}

function openCountdownCalendar(target){countdownCalendarTarget=target;const value=document.getElementById(target)?.value;if(value){const [y,m]=value.split('-').map(Number);countdownCalendarView=new Date(y,m-1,1)}else countdownCalendarView=new Date(new Date().getFullYear(),new Date().getMonth(),1);renderCountdownCalendar()}
function moveCountdownCalendar(){countdownCalendarView=new Date(countdownCalendarView.getFullYear(),countdownCalendarView.getMonth()+1,1);renderCountdownCalendar()}
function changeCountdownYear(year){const y=Number(year);if(!Number.isFinite(y))return;countdownCalendarView=new Date(y,countdownCalendarView.getMonth(),1);renderCountdownCalendar()}
function countdownYearOptions(selectedYear){let options='';for(let year=1900;year<=2100;year++)options+=`<option value="${year}"${year===selectedYear?' selected':''}>${year}</option>`;return options}
function renderCountdownCalendar(){const box=document.getElementById('cdCalendar');if(!box)return;const y=countdownCalendarView.getFullYear(),m=countdownCalendarView.getMonth(),first=new Date(y,m,1).getDay(),total=new Date(y,m+1,0).getDate(),today=countdownISO(new Date()),selected=document.getElementById(countdownCalendarTarget||'')?.value||'';let cells='';for(let i=0;i<first;i++)cells+='<button class="empty" tabindex="-1"></button>';for(let day=1;day<=total;day++){const iso=countdownISO(new Date(y,m,day));cells+=`<button type="button" class="${iso===today?'today ':''}${iso===selected?'selected':''}" onclick="chooseCountdownDate('${iso}')">${day}</button>`}let used=first+total;while(used%7){cells+='<button class="empty" tabindex="-1"></button>';used++;}const monthName=countdownMonthName(countdownCalendarView).replace(/\s+de\s+\d{4}$/,'');box.innerHTML=`<div class="custom-date-calendar-header"><strong>${monthName}</strong><select class="custom-date-year" aria-label="Escolher ano" onchange="changeCountdownYear(this.value)">${countdownYearOptions(y)}</select><button type="button" class="custom-date-next" aria-label="Avançar mês" onclick="moveCountdownCalendar()">›</button></div><div class="custom-date-weekdays"><span>dom</span><span>seg</span><span>ter</span><span>qua</span><span>qui</span><span>sex</span><span>sáb</span></div><div class="custom-date-grid">${cells}</div>`;box.classList.remove('hidden')}
function chooseCountdownDate(iso){const input=document.getElementById(countdownCalendarTarget);if(!input)return;input.value=iso;input.dispatchEvent(new Event('input',{bubbles:true}));const display=document.getElementById(countdownCalendarTarget+'Display');if(display){const [y,m,d]=iso.split('-').map(Number);display.textContent=`${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`;display.classList.add('value-entered')}document.getElementById('cdCalendar')?.classList.add('hidden')}
function directDateOptions(max,placeholder){let options=`<option value="">${placeholder}</option>`;for(let i=1;i<=max;i++)options+=`<option value="${i}">${String(i).padStart(2,'0')}</option>`;return options}
function directYearOptions(){let options='<option value="">ano</option>';for(let year=1900;year<=2100;year++)options+=`<option value="${year}">${year}</option>`;return options}
function directMonthOptions(){const months=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];return '<option value="">mês</option>'+months.map((month,index)=>`<option value="${index+1}">${month}</option>`).join('')}
function directCountdownDateField(prefix){return `<div class="direct-date-entry"><select id="${prefix}Day" aria-label="Dia" onchange="syncDirectCountdownDate('${prefix}')">${directDateOptions(31,'dia')}</select><select id="${prefix}Month" aria-label="Mês" onchange="syncDirectCountdownDate('${prefix}')">${directMonthOptions()}</select><input id="${prefix}Year" type="number" min="1" max="9999" placeholder="ano" aria-label="Ano" oninput="syncDirectCountdownDate('${prefix}')"><input id="${prefix}" type="hidden"></div>`}
function syncDirectCountdownDate(prefix){const day=Number(document.getElementById(prefix+'Day')?.value),month=Number(document.getElementById(prefix+'Month')?.value),year=Number(document.getElementById(prefix+'Year')?.value);['Day','Month','Year'].forEach(part=>{const el=document.getElementById(prefix+part);if(el)el.classList.toggle('value-entered',el.value!=='')});const hidden=document.getElementById(prefix);if(!hidden)return;if(!day||!month||!year){hidden.value='';return}const date=new Date(year,month-1,day);if(date.getFullYear()!==year||date.getMonth()!==month-1||date.getDate()!==day){hidden.value='';return}hidden.value=`${String(year).padStart(4,'0')}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;hidden.dispatchEvent(new Event('input',{bubbles:true}))}
function setCurrentCountdownStart(){const today=new Date(),parts={Day:String(today.getDate()),Month:String(today.getMonth()+1),Year:String(today.getFullYear())};for(const [part,value] of Object.entries(parts)){const field=document.getElementById('cdStart'+part);if(field){field.value=value;field.classList.add('value-entered');field.style.color='#1261d6'}}syncDirectCountdownDate('cdStart')}
function countdown(){return head('Contagem Regressiva de Datas','Descubra exatamente quanto tempo existe entre duas datas')+`<div class="card"><div class="field"><label for="cdStartDay">Data inicial</label>${directCountdownDateField('cdStart')}</div><div class="field"><label for="cdEndDay">Data final</label>${directCountdownDateField('cdEnd')}</div><div class="actions"><button class="btn primary" onclick="calcCountdown()">▣ Calcular</button><button class="btn secondary" onclick="clearForm('countdown')">↻ Limpar Campos</button></div><div id="cdres" class="result"><b>Resultado detalhado</b><div class="line"><span>Resultado em dias</span><b>0 dias</b></div><div class="line"><span>Resultado em meses e dias</span><b>0 meses e 0 dias</b></div><div class="line"><span>Resultado em anos, meses e dias</span><b>0 anos, 0 meses e 0 dias</b></div></div><button class="btn secondary full" onclick="archiveCountdownResult()">☆ Arquivar Resultado</button><h3>Resultados arquivados</h3><div id="cdArchive" class="compare-grid"></div><div class="note">Digite o dia, o mês e o ano nas duas datas. O cálculo considera dias corridos.</div></div>`}
function countdownDate(value){const [y,m,d]=String(value).split('-').map(Number);return {y,m,d,ms:Date.UTC(y,m-1,d)}}
function countdownParts(startValue,endValue){if(!startValue||!endValue)return null;const start=countdownDate(startValue),end=countdownDate(endValue);if(end.ms<start.ms)return {past:true};const days=Math.round((end.ms-start.ms)/86400000);let cursor=new Date(start.ms),totalMonths=0;while(true){const next=new Date(Date.UTC(cursor.getUTCFullYear(),cursor.getUTCMonth()+1,cursor.getUTCDate()));if(next.getTime()<=end.ms){cursor=next;totalMonths++}else break}const remainingDays=Math.round((end.ms-cursor.getTime())/86400000);return {startValue,endValue,days,totalMonths,years:Math.floor(totalMonths/12),months:totalMonths%12,remainingDays}}
function countdownDetailedText(data){return `${data.years} ${data.years===1?'ano':'anos'}, ${data.months} ${data.months===1?'mês':'meses'} e ${data.remainingDays} ${data.remainingDays===1?'dia':'dias'}`}
function countdownMonthsDaysText(data){const totalMonths=data.totalMonths??(data.years*12+data.months);return `${totalMonths} ${totalMonths===1?'mês':'meses'} e ${data.remainingDays} ${data.remainingDays===1?'dia':'dias'}`}
function calcCountdown(){const data=countdownParts(readCountdownDate('cdStart'),readCountdownDate('cdEnd')),result=document.getElementById('cdres');if(!data){alert('Informe as duas datas para fazer a contagem.');return}if(data.past){result.innerHTML='<b>Contagem entre as datas</b><div class="big">A data final é anterior</div><div class="line"><span>Verifique as datas</span><b>Escolha uma data final posterior</b></div>';return}result.innerHTML=`<b>Resultado detalhado</b><div class="line"><span>Resultado em dias</span><b>${data.days.toLocaleString('pt-BR')} ${data.days===1?'dia':'dias'}</b></div><div class="line"><span>Resultado em meses e dias</span><b>${countdownMonthsDaysText(data)}</b></div><div class="line"><span>Resultado em anos, meses e dias</span><b>${countdownDetailedText(data)}</b></div>`}
function countdownArchiveItems(){try{return JSON.parse(localStorage.getItem('basequin-countdown-archive')||'[]')}catch(e){return []}}
function renderCountdownArchive(){const box=document.getElementById('cdArchive');if(!box)return;const items=countdownArchiveItems();if(!items.length){box.innerHTML='<div class="note">Nenhum resultado arquivado.</div>';return}box.innerHTML=items.map(item=>{const saved=new Date(item.savedAt).toLocaleString('pt-BR');return `<div class="indicator-card"><div class="compare-top"><div><strong>${item.startValue.split('-').reverse().join('/')} até ${item.endValue.split('-').reverse().join('/')}</strong><span class="compare-tag">Arquivado em ${saved}</span></div><div class="compare-total"><small>Total</small><b>${item.days.toLocaleString('pt-BR')} dias</b></div></div><div class="compare-row"><span>Meses e dias</span><b>${countdownMonthsDaysText(item)}</b></div><div class="compare-row"><span>Anos, meses e dias</span><b>${countdownDetailedText(item)}</b></div><button class="btn secondary" style="width:100%;min-height:38px;margin-top:10px;padding:8px;font-size:12px" onclick="removeCountdownArchive(${item.id})">Excluir arquivo</button></div>`}).join('')}
function archiveCountdownResult(){const data=countdownParts(readCountdownDate('cdStart'),readCountdownDate('cdEnd'));if(!data){alert('Informe as duas datas antes de arquivar o resultado.');return}if(data.past){alert('A data final precisa ser posterior à data inicial.');return}const items=countdownArchiveItems();items.unshift({...data,id:Date.now(),savedAt:new Date().toISOString()});try{localStorage.setItem('basequin-countdown-archive',JSON.stringify(items));renderCountdownArchive();alert('Resultado arquivado.')}catch(e){alert('Não foi possível arquivar este resultado.')}}
function removeCountdownArchive(id){const items=countdownArchiveItems().filter(item=>item.id!==id);localStorage.setItem('basequin-countdown-archive',JSON.stringify(items));renderCountdownArchive()}
function rule(){return head('Calculadora de Regra de Três','Resolva proporções simples: "A" está para "B" assim como "C" está para "D"')+`<div class="card"><div class="rule-equation-row"><div class="field"><label>A</label><input id="ra" type="number" value="0"></div><span class="rule-arrow" aria-hidden="true">→</span><div class="field"><label>B</label><input id="rb" type="number" value="0"></div></div><div class="rule-equation-row"><div class="field"><label>C</label><input id="rc" type="number" value="0"></div><span class="rule-arrow" aria-hidden="true">→</span><div class="field"><label>D</label><div id="rres" style="background:#eceeef;border-radius:9px;padding:13px;font-weight:900;font-size:16px;text-align:center">D = 0</div></div></div><div class="actions" style="grid-template-columns:1fr;row-gap:9px"><button class="btn primary" onclick="calcRule()">▣ Calcular</button><button class="btn secondary" onclick="clearForm('rule')">↻ Limpar Campos</button></div></div>`}
function calcRule(){let A=n('ra'),B=n('rb'),C=n('rc');if(A===0){alert('A não pode ser zero.');return}let x=B*C/A;document.getElementById('rres').textContent=`D = ${x.toLocaleString('pt-BR',{maximumFractionDigits:6})}`}
let simpleCalcState={display:'0',stored:null,operator:null,waiting:true};
function simple(){simpleCalcState={display:'0',stored:null,operator:null,waiting:true};return head('Calculadora Simples','Use o teclado numérico para fazer operações básicas')+`<div class="card"><input id="sdisplay" class="simple-display" value="0" readonly aria-label="Visor da calculadora"><div class="simple-keypad"><button class="clear" onclick="simpleKey('C')">C</button><button onclick="simpleKey('back')">⌫</button><button onclick="simpleKey('%')">%</button><button class="operator" onclick="simpleKey('/')">÷</button><button onclick="simpleKey('7')">7</button><button onclick="simpleKey('8')">8</button><button onclick="simpleKey('9')">9</button><button class="operator" onclick="simpleKey('*')">×</button><button onclick="simpleKey('4')">4</button><button onclick="simpleKey('5')">5</button><button onclick="simpleKey('6')">6</button><button class="operator" onclick="simpleKey('-')">−</button><button onclick="simpleKey('1')">1</button><button onclick="simpleKey('2')">2</button><button onclick="simpleKey('3')">3</button><button class="operator" onclick="simpleKey('+')">+</button><button class="zero" onclick="simpleKey('0')">0</button><button onclick="simpleKey('.')">,</button><button class="equals" onclick="simpleKey('=')">=</button></div><div class="note">C = limpar · ⌫ = apagar · % = porcentagem</div></div>`}
function simpleUpdateDisplay(){const e=document.getElementById('sdisplay');if(e){const symbols={'+':'+','-':'−','*':'×','/':'÷'};e.value=simpleCalcState.display+(simpleCalcState.waiting&&simpleCalcState.operator?' '+symbols[simpleCalcState.operator]:'');e.classList.toggle('value-entered',simpleCalcState.display!=='0')}}
function simpleFormat(value){return value.toLocaleString('pt-BR',{maximumFractionDigits:10})}
function simpleParse(value){return Number(String(value).replace(/\./g,'').replace(',','.'))||0}
function simpleOperate(a,b,op){if(op==='/'&&b===0){alert('Não é possível dividir por zero.');return null}return op==='+'?a+b:op==='-'?a-b:op==='*'?a*b:a/b}
function simpleKey(key){const s=simpleCalcState;if(key==='C'){simpleClear();return}if(key==='back'){if(!s.waiting&&s.display.length>1)s.display=s.display.slice(0,-1);else if(!s.waiting)s.display='0';simpleUpdateDisplay();return}if(key==='%'){const current=simpleParse(s.display);const value=s.stored!==null&&s.operator&&(['+','-'].includes(s.operator))?s.stored*current/100:current/100;s.display=simpleFormat(value);s.waiting=true;simpleUpdateDisplay();return}if(['+','-','*','/'].includes(key)){const input=simpleParse(s.display);if(s.stored===null)s.stored=input;else if(s.operator&&!s.waiting){const result=simpleOperate(s.stored,input,s.operator);if(result===null)return;s.stored=result;s.display=simpleFormat(result)}s.operator=key;s.waiting=true;simpleUpdateDisplay();return}if(key==='='){if(s.stored!==null&&s.operator){const input=simpleParse(s.display);const result=simpleOperate(s.stored,input,s.operator);if(result===null)return;s.display=simpleFormat(result);s.stored=null;s.operator=null;s.waiting=true;simpleUpdateDisplay()}return}if(key==='.') {if(s.waiting){s.display='0,';s.waiting=false}else if(!s.display.includes(','))s.display+=',';simpleUpdateDisplay();return}if(/^\d$/.test(key)){if(s.waiting||s.display==='0')s.display=key;else s.display+=key;s.waiting=false;simpleUpdateDisplay()}}
function simpleClear(){simpleCalcState={display:'0',stored:null,operator:null,waiting:true};simpleUpdateDisplay()}

function rates(){return head('Taxas Equivalentes','Converta uma taxa para outro período')+`<div class="card"><div class="field"><label>Taxa informada (%)</label><input id="ri" type="number" step="0.01" value="0"></div><div class="row"><div class="field"><label>De</label><select id="rf"><option value="1">Anual</option><option value="12">Mensal</option><option value="365">Diária</option></select></div><div class="field"><label>Para</label><select id="rt"><option value="12">Mensal</option><option value="1">Anual</option><option value="365">Diária</option></select></div></div><div class="actions"><button class="btn primary" onclick="calcRates()">▣ Calcular</button><button class="btn secondary" onclick="clearForm('rates')">↻ Limpar Campos</button></div><div id="rateres" class="result"><b>Taxa equivalente</b><div class="big">0,00%</div></div></div>`}
function calcRates(){
  const rateInput=n('ri'),from=+document.getElementById('rf').value,to=+document.getElementById('rt').value;
  if(!Number.isFinite(rateInput)||rateInput<=-100){alert('Informe uma taxa válida maior que -100%.');return}
  const x=Math.pow(1+rateInput/100,from/to)-1;
  document.getElementById('rateres').innerHTML=`<b>Taxa equivalente</b><div class="big">${pct(x*100)}</div>`
}
function loan(){return head('Empréstimos Financeiros','Sistema de amortização PRICE')+`<div class="card"><div class="field"><label>Valor do empréstimo (R$)</label><input id="li" type="text" inputmode="decimal" value="0,00" onfocus="if(this.value==='0,00'){this.value='';this.classList.remove('value-entered')}" oninput="formatCurrencyTyping(this)" onblur="formatValueField(this)"></div><div class="row"><div class="field"><label>Taxa mensal (%)</label><input id="lr" type="number" step="0.01" value="0"></div><div class="field"><label>Prazo (meses)</label><input id="ln" type="number" value="0"></div></div><div class="actions"><button class="btn primary" onclick="calcLoan()">▣ Calcular</button><button class="btn secondary" onclick="clearForm('loan')">↻ Limpar Campos</button></div><div id="loanres" class="result"><b>Resultado</b><div class="big">R$ 0,00</div></div></div>`}
function calcLoan(){
  const pv=n('li'),rateInput=n('lr'),N=Math.floor(n('ln'));
  if(!Number.isFinite(pv)||!Number.isFinite(rateInput)||pv<0||rateInput<0||N<=0){alert('Informe valor, taxa e um prazo válido maior que zero.');return}
  const r=rateInput/100,pay=r?pv*r/(1-Math.pow(1+r,-N)):pv/N,total=pay*N;
  document.getElementById('loanres').innerHTML=`<b>Parcela estimada</b><div class="big">${BRL.format(pay)}</div><div class="line"><span>Total pago</span><b>${BRL.format(total)}</b></div><div class="line"><span>Juros totais</span><b>${BRL.format(total-pv)}</b></div>`
}
function mortgage(){return head('Financiamento Imobiliário','Compare PRICE e SAC')+`<div class="card"><div class="field"><label>Valor do imóvel (R$)</label><input id="mi" type="text" inputmode="decimal" value="0,00" onfocus="if(this.value==='0,00'){this.value='';this.classList.remove('value-entered')}" oninput="formatCurrencyTyping(this)" onblur="formatValueField(this)"></div><div class="row"><div class="field"><label>Entrada (R$)</label><input id="me" type="text" inputmode="decimal" value="0,00" onfocus="if(this.value==='0,00'){this.value='';this.classList.remove('value-entered')}" oninput="formatCurrencyTyping(this)" onblur="formatValueField(this)"></div><div class="field"><label>Taxa anual - CET (%)</label><input id="mr" type="number" step="0.01" value="0"></div></div><div class="field"><label>Prazo (meses)</label><input id="mn" type="number" value="0"></div><div class="field"><label>Sistema</label><div class="switch"><button id="mprice" class="active" onclick="toggle('mprice','msac')">PRICE</button><button id="msac" onclick="toggle('msac','mprice')">SAC</button></div></div><div class="actions"><button class="btn primary" onclick="calcMortgage()">▣ Calcular</button><button class="btn secondary" onclick="clearForm('mortgage')">↻ Limpar Campos</button></div><div id="mres" class="result"><b>Resultado</b><div class="big">R$ 0,00</div></div></div>`}
function calcMortgage(){
  const imovel=n('mi'),entrada=n('me'),rateInput=n('mr'),N=Math.floor(n('mn'));
  if(!Number.isFinite(imovel)||!Number.isFinite(entrada)||!Number.isFinite(rateInput)||imovel<=0||entrada<0||entrada>imovel||rateInput<0||N<=0){alert('Informe valores válidos. A entrada não pode superar o valor do imóvel.');return}
  const pv=imovel-entrada,rAnual=rateInput/100,r=Math.pow(1+rAnual,1/12)-1,sac=document.getElementById('msac').classList.contains('active');
  let first,last,total;
  if(sac){const amort=pv/N;first=amort+pv*r;last=amort+(pv-(N-1)*amort)*r;total=Array.from({length:N},(_,i)=>amort+(pv-i*amort)*r).reduce((a,b)=>a+b,0)}
  else{first=r?pv*r/(1-Math.pow(1+r,-N)):pv/N;last=first;total=first*N}
  document.getElementById('mres').innerHTML=`<b>${sac?'SAC':'PRICE'}</b><div class="big">${BRL.format(first)}</div><div class="line"><span>Primeira parcela</span><b>${BRL.format(first)}</b></div><div class="line"><span>Última parcela</span><b>${BRL.format(last)}</b></div><div class="line"><span>Total pago</span><b>${BRL.format(total+entrada)}</b></div><div class="line"><span>Juros estimados</span><b>${BRL.format(total-pv)}</b></div>`
}

'<b>Resultado</b><div class="big">R$ 0,00</div>';document.querySelectorAll('#calc input,#calc select,#calc textarea').forEach(el=>el.classList.remove('value-entered'))}
